name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write
  actions: read
  security-events: write

jobs:
  go-check:
    uses: duynhlab/gha-workflows/.github/workflows/go-check.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    with:
      command-test: 'go test -race -coverprofile=coverage.out ./...'
      lint: true
      policy-lint: true
      policy-lint-blocking: true
      integration: true
      integration-command: 'go test -v -tags=integration -covermode=atomic -coverprofile=coverage-integration.out ./internal/core/repository/...'

  gitleaks:
    uses: duynhlab/gha-workflows/.github/workflows/gitleaks.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    permissions:
      contents: read
      security-events: write

  sonar:
    needs: [go-check, gitleaks]
    uses: duynhlab/gha-workflows/.github/workflows/sonarqube.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    with:
      project-key: 'duynhlab_${{ github.event.repository.name }}'
      organization: 'duynhlab'
      fail-on-quality-gate: false
      integration-coverage: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    needs: [go-check, sonar]
    uses: duynhlab/gha-workflows/.github/workflows/docker-build-go.yml@93dfeeecb0aec27c39d5b35bfd9b6a5092a1064b # main
    with:
      image-name: ${{ github.event.repository.name }}
      push: true
      scan-before-push: true
      scan-severity: 'CRITICAL,HIGH'
      scan-exit-code: '1'
    permissions:
      contents: read
      packages: write
      actions: read

  trivy-report:
    needs: [docker-build]
    if: needs.docker-build.outputs.scan-status == 'pass'
    uses: duynhlab/gha-workflows/.github/workflows/trivy-scan.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    with:
      image-ref: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}@${{ needs.docker-build.outputs.digest }}
      severity: 'CRITICAL,HIGH,MEDIUM'
      exit-code: '0'
      ignore-unfixed: true
    # Named, not inherited: the only secrets this workflow declares.
    secrets:
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
    permissions:
      contents: read
      packages: read
      security-events: write

  docker-sign:
    needs: [docker-build]
    uses: duynhlab/gha-workflows/.github/workflows/docker-sign.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    with:
      tags: ${{ needs.docker-build.outputs.tags }}
      digest: ${{ needs.docker-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # Binary release (GoReleaser, keyless-signed) — runs on v* tags.
  # A service that doesn't need a binary release simply omits this job.
  release-binary:
    needs: [go-check, sonar]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: duynhlab/gha-workflows/.github/workflows/goreleaser.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    permissions:
      contents: write
      id-token: write

  notify:
    if: always()
    needs: [go-check, gitleaks, sonar, docker-build, trivy-report, docker-sign, release-binary]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@28cee20e57431d6f4565e68be5f38c8a447c903e # main
    with:
      slack_channel_id: "C0AD82A9A74"
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
